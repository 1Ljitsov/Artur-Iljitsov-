<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artur Iljitsov</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#fbf9f4;
      --text:#181512;
      --muted:#7e756f;
      --line:#d8d3cd;
      --gold:#775a19;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:'Manrope',sans-serif;
      overflow-x:hidden;
    }

    .container{
      max-width:1280px;
      margin:0 auto;
      padding:0 80px;
    }

    header{
      position:fixed;
      top:0;
      width:100%;
      backdrop-filter:blur(12px);
      background:rgba(251,249,244,.88);
      border-bottom:1px solid rgba(0,0,0,.06);
      z-index:100;
    }

    .header-inner{
      height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo{
      font-family:'EB Garamond',serif;
      font-size:22px;
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    nav{
      display:flex;
      gap:40px;
    }

    nav a{
      text-decoration:none;
      color:var(--muted);
      font-size:11px;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    .hero{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .hero h1{
      font-family:'EB Garamond',serif;
      font-size:92px;
      font-weight:500;
      letter-spacing:-0.04em;
      margin-bottom:24px;
    }

    .hero p{
      max-width:650px;
      margin:0 auto;
      line-height:1.8;
      color:#5b534d;
    }

    .line{
      width:1px;
      height:120px;
      background:var(--line);
      margin:70px auto 0;
    }

    footer{
      border-top:1px solid var(--line);
      padding:80px 0;
      text-align:center;
    }

    footer h2{
      font-family:'EB Garamond',serif;
      letter-spacing:.14em;
      margin-bottom:20px;
      text-transform:uppercase;
    }

    footer a{
      text-decoration:none;
      color:var(--text);
      font-size:11px;
      letter-spacing:.2em;
      text-transform:uppercase;
      border-bottom:1px solid var(--text);
      padding-bottom:6px;
    }

    @media(max-width:768px){
      .container{
        padding:0 20px;
      }

      nav{
        gap:16px;
      }

      nav a{
        font-size:9px;
      }

      .hero h1{
        font-size:48px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <div class="header-inner">

      <div class="logo">
        Artur Iljitsov
      </div>

      <nav>
        <a href="#">Biography</a>
        <a href="#">Journey</a>
        <a href="#">Achievements</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
      </nav>

    </div>
  </div>
</header>

<section class="hero">
  <div class="container">

    <h1>Artur Iljitsov</h1>

    <p>
      A cinematic biography shaped through silence,
      discipline and timeless interpretation.
    </p>

    <div class="line"></div>

  </div>
</section>

<footer>
  <div class="container">

    <h2>Artur Iljitsov</h2>

    <a href="#">Instagram</a>

  </div>
</footer>

</body>
</html>
